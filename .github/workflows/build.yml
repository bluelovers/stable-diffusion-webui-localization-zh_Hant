name: build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
#      - 'test/**'
      - '.run/**'
#      - '.github/**'
      - '/*.*'
      - '/.*'
  schedule:
## https://help.github.com/en/actions/automating-your-workflow-with-github-actions/events-that-trigger-workflows#scheduled-events-schedule
##            ┌───────────── minute (0 - 59)
##            │ ┌───────────── hour (0 - 23)
##            │ │ ┌───────────── day of the month (1 - 31)
##            │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
##            │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
##            │ │ │ │ │
##            │ │ │ │ │
##            │ │ │ │ │
##            * * * * *
#    - cron: '* * 1 * *'
#    - cron: '* * 15 * *'
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    strategy:
      matrix:
        node-version: [ 26 ]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 2
          ref: dev
      - name: Set up Node.js ${{ matrix.node-version }} + pnpm
        uses: pnpm/setup@v1
        with:
          version: next-12
          runtime: node@${{ matrix.node-version }}
          cache: true
      - name: set cache id
        id: id-cache
        run: echo "::set-output name=id::${GITHUB_SHA}"
      - name: echo var
        run: |
          echo ${{ steps.id-cache.outputs.id }}
          echo ${GITHUB_SHA}
      - name: setup git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      - name: install deps
        run: |
          pnpm install --frozen-lockfile
          echo pnpm run ci:install
      - name: run script
        if: success()
        run: pnpm run ci:build
      - name: Push output
        if: success()
        uses: casperdcl/push-dir@v1
        with:
          message: "build: static localizations"
          branch: main
          dir: output
      - name: Push changes
        if: success()
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev
